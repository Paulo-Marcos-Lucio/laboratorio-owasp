spring.application.name=laboratorio-owasp

# CONFINAMENTO AO LOOPBACK - NAO ALTERE.
# O padrao do Spring Boot e escutar em 0.0.0.0 (todas as interfaces). Como
# /a05/cmd/vulneravel entrega a entrada a um shell do sistema operacional, o padrao
# expoe execucao de comando arbitraria, sem autenticacao, para qualquer maquina da
# mesma rede (Wi-Fi de coworking, faculdade, VPN de malha). Escutar so em 127.0.0.1
# nao muda nenhuma licao: todos os exemplos usam localhost.
# O teste ConfiguracaoDeRedeTest reprova o build se esta linha sumir.
server.address=127.0.0.1

# H2 em memoria, populado por schema.sql + data.sql
spring.datasource.url=jdbc:h2:mem:labowasp;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# Nao logar stack traces detalhados em producao (o proprio A05 seria vazar isso)
server.error.include-message=never
server.error.include-stacktrace=never
