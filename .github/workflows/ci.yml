name: CI

on:
  push:
    branches: [main]
  pull_request:

# Piso de permissao para o workflow inteiro; o job estreita para o minimo que usa.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Formatação · Testes (JUnit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # actions fixadas por SHA de 40 hex (nunca tag movel — a mesma prática que o Esteira exige).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: chmod +x ./mvnw
      # `verify` engloba o `test`, o spotless:check (formatação) e o relatório JaCoCo.
      # É o mesmo comando do desenvolvedor: se passa aqui, passa lá.
      - name: Formatação e testes (exploit vs correção)
        run: ./mvnw -B verify
