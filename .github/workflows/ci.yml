name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Formatação · Testes (JUnit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions fixadas por SHA (a mesma prática que o Esteira exige).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: chmod +x ./mvnw
      # `verify` engloba o `test` e ainda roda o spotless:check (formatação).
      - name: Formatação e testes (exploit vs correção)
        run: ./mvnw -B verify
